<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <defs>
    <style>
      .term-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 13px;
        letter-spacing: -0.01em;
      }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Window Card -->
  <rect x="8" y="8" width="744" height="524" rx="12" fill="#0B1329" stroke="#1E293B" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Window Header Bar -->
  <path d="M 8 20 A 12 12 0 0 1 20 8 L 740 8 A 12 12 0 0 1 752 20 L 752 42 L 8 42 Z" fill="#111C3D"/>
  <line x1="8" y1="42" x2="752" y2="42" stroke="#1E293B" stroke-width="1"/>

  <!-- Window Control Buttons -->
  <circle cx="28" cy="25" r="5.5" fill="#EF4444"/>
  <circle cx="46" cy="25" r="5.5" fill="#F59E0B"/>
  <circle cx="64" cy="25" r="5.5" fill="#10B981"/>

  <!-- Terminal Title -->
  <text x="380.0" y="29" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">
    genome-studio — High-Performance Rust Sequence CLI
  </text>

  <!-- Terminal Body Content -->
  <g class="term-text">
    <text x="28" y="65" fill="#38BDF8" font-weight="600">$ genome-studio analyze datasets/fixtures/draft_v1.fasta</text><text x="28" y="87" fill="#A7F3D0" font-weight="400">=== Genome Assembly Studio Sequence Analysis ===</text><text x="28" y="109" fill="#94A3B8" font-weight="400">File:                datasets/fixtures/draft_v1.fasta</text><text x="28" y="131" fill="#E2E8F0" font-weight="400">Total length:        48,500 bp</text><text x="28" y="153" fill="#E2E8F0" font-weight="400">Sequences:           12</text><text x="28" y="175" fill="#E2E8F0" font-weight="400">Contigs:             13</text><text x="28" y="197" fill="#60A5FA" font-weight="400">N50:                 4,000 bp (L50: 5)</text><text x="28" y="219" fill="#94A3B8" font-weight="400">N90:                 2,500 bp (L90: 11)</text><text x="28" y="241" fill="#60A5FA" font-weight="400">auN:                 4,382.5 bp</text><text x="28" y="263" fill="#34D399" font-weight="400">GC content:          51.45%</text><text x="28" y="285" fill="#94A3B8" font-weight="400">N content:           0.10%</text><text x="28" y="307" fill="#FBBF24" font-weight="400">Gaps:                1 (50 bp total)</text><text x="28" y="329" fill="#94A3B8" font-weight="400">Artifacts saved:     results/analysis.json</text><text x="28" y="373" fill="#38BDF8" font-weight="600">$ genome-studio graph-stats datasets/fixtures/assembly_graph.gfa</text><text x="28" y="395" fill="#A7F3D0" font-weight="400">=== Assembly Graph Summary ===</text><text x="28" y="417" fill="#E2E8F0" font-weight="400">Nodes: 9  |  Edges: 9  |  Dead ends: 2  |  Branch points: 2</text><text x="28" y="461" fill="#38BDF8" font-weight="600">$ genome-studio align-stats datasets/fixtures/v1_to_ref.paf</text><text x="28" y="483" fill="#E2E8F0" font-weight="400">Alignments: 13  |  Aligned length: 48,400 bp  |  Matches: 48,115 (99.4%)</text>
  </g>
</svg>