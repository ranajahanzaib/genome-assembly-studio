[package]
name = "assembly-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "genome-studio"
path = "src/main.rs"

[dependencies]
assembly-core = { path = "../assembly-core" }
sequence-io = { path = "../sequence-io" }
assembly-stats = { path = "../assembly-stats" }
genome-index = { path = "../genome-index" }
genome-tiles = { path = "../genome-tiles" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
